グ事業部","template":"overview","texts":[{"text":"4.エンジニアリング事業部","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"概要","x":0.05984375,"y":0.14416666666666667,"w":0.31979166666666664,"h":0.05814814814814815,"footer":false},{"text":"1. チーム\n弊社SES事業部エンジニアチームは、25名以上の多国籍エンジニアチーム（日本人エンジニア含む）\n平均7年以上の業務経験を有し、AI・クラウド・システム開発・データ分析など幅広い分野をカバー","x":0.08401041666666667,"y":0.2364814814814815,"w":0.244375,"h":0.2940740740740741,"footer":false},{"text":"2.業界経験：\n官公庁・自治体、メガバンク、医療、物流、自動運転など多様な業界でのPJ実績\nAWS基盤構築、AI・LLM開発、大規模データ分析、CI/CD自動化など多数","x":0.3733854166666667,"y":0.23879629629629628,"w":0.24583333333333332,"h":0.2388888888888889,"footer":false},{"text":"3.能力：\n要件定義から設計・開発・運用保守まで一貫対応\nSES常駐型と受託開発の両方に対応し、柔軟なサービス提供が可能","x":0.6848958333333334,"y":0.23879629629629628,"w":0.23942708333333335,"h":0.2612962962962963,"footer":false},{"text":"※部門紹介 詳細ページ：","x":0.0746875,"y":0.6360185185185185,"w":0.3333333333333333,"h":0.053703703703703705,"footer":false},{"text":"インフラ部：クラウド基盤・ネットワークインフラの設計・構築・運用（AWS/GCP/Azureなど）","x":0.09776041666666667,"y":0.6948148148148148,"w":0.38473958333333336,"h":0.07611111111111112,"footer":false},{"text":"システム開発部：AI・自動運転・LLM・データ分析・アプリケーション／業務システム開発","x":0.09776041666666667,"y":0.797962962962963,"w":0.38,"h":0.06712962962962964,"footer":false}],"media":[{"src":"assets/semantic/p05-img01.png","x":0.6366145833333333,"y":0.5836111111111111,"w":0.28770833333333334,"h":0.3410185185185185,"kind":"image"}]},{"page":6,"source":8,"title":"4.1 インフラ部","template":"dashboard","texts":[{"text":"4.1　インフラ部","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"実績","x":0.05984375,"y":0.15472222222222223,"w":0.31979166666666664,"h":0.05814814814814815,"footer":false},{"text":"ネット金融サービス向けAWSクラウド基盤構築・CI/CD自動化（延べ40+人月）\nメガバンク次期基盤構築・運用保守（延べ100+人月）\n医療データ専門会社向けデータ基盤構築・運用保守（延べ100+人月）\nAWSベースの物流WMSシステム開発・レガシーシステム移行・画像認識PoC（延べ200+人月）\nRFP対応：要件定義〜設計・運用まで一貫対応、PM/PLによる高品質推進\nインフラ自動化（IaC: Terraform/CloudFormation）、セキュリティ・監視運用対応\n資格保有者：AWS/GCP/Azure/Oracle等のベンダー資格延べ20名、PMP含むPM資格者2名","x":0.061197916666666664,"y":0.22935185185185186,"w":0.5022395833333333,"h":0.5556481481481481,"footer":false}],"media":[{"src":"assets/semantic/p06-img01.png","x":0.5744791666666667,"y":0.21287037037037038,"w":0.39140625,"h":0.4640740740740741,"kind":"image"}]},{"page":7,"source":9,"title":"4.2 システム開発部","template":"dashboard","texts":[{"text":"4.2　システム開発部","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"実績","x":0.05984375,"y":0.15537037037037038,"w":0.35453125,"h":0.05814814814814815,"footer":false},{"text":"AI関連プロジェクト多数（OCR×AI、画像認識、医療AI、NLP、物流AI最適化、自動運転など）\nLLMモデル構築、アルゴリズム最適化、Deep Learning活用による開発実績\nAI参画エンジニア比率20%以上、Kaggleメダル受賞エンジニア複数在籍\nAI/MLスタック（TensorFlow、PyTorch、OpenCV、Sagemaker、Azure MLなど）\nWeb・業務システム・モビリティ向けアプリ開発実績\n受託開発（AI、Web、業務システム等）10件以上、クライアントニーズに応じ柔軟対応","x":0.07015625,"y":0.2401851851851852,"w":0.40036458333333336,"h":0.5876851851851852,"footer":false}],"media":[{"src":"assets/semantic/p07-img01.png","x":0.5469270833333333,"y":0.267037037037037,"w":0.35744791666666664,"h":0.42388888888888887,"kind":"image"}]},{"page":8,"source":11,"title":"5.ソリューション事業部","template":"three-col","texts":[{"text":"5.ソリューション事業部","x":0.052447916666666664,"y":0.027407407407407408,"w":0.5899479166666667,"h":0.08324074074074074,"footer":false},{"text":"1. チーム","x":0.06572916666666667,"y":0.19666666666666666,"w":0.25,"h":0.053425925925925925,"footer":false},{"text":"ソリューション事業部は、業務改善・業務効率化を目的としたITソリューションを企画・導入・運用まで一貫して支援する部門。\nノーコード／ローコード開発、業務自動化、AI技術活用に強みを持つ。","x":0.06979166666666667,"y":0.2487037037037037,"w":0.26328125,"h":0.15851851851851853,"footer":false},{"text":"2.実績と強み","x":0.06916666666666667,"y":0.42333333333333334,"w":0.3333333333333333,"h":0.049166666666666664,"footer":false},{"text":"3.今後の提供価値・サービス","x":0.06890625,"y":0.6782407407407407,"w":0.4089583333333333,"h":0.049166666666666664,"footer":false},{"text":"クライアントの業務フローをヒアリングし、最適なDX化計画を提案・設計・実装。\nYeeflow、PowerAutomate、RPAなどを活用した業務プロセスの自動化支援。\nAI画像生成／生成系AIを組み込んだ業務支援ツールの開発。\n既存業務アプリの改善提案、データ活用・可視化ダッシュボードの設計。\n社内外プレゼン・資料作成の業務支援や可視化支援なども対応可能。","x":0.07114583333333334,"y":0.7310185185185185,"w":0.44171875,"h":0.16935185185185186,"footer":false},{"text":"ソリューション事業部 概要","x":0.058333333333333334,"y":0.13657407407407407,"w":0.3333333333333333,"h":0.053703703703703705,"footer":false},{"text":"Yeeflowを活用した業務アプリ構築（請求処理、勤怠管理、在庫管理など）。\nロボット導入支援（介護施設・飲食店などでの設置・運用）。\nAI画像生成を活用した提案業務の自動化（ChatGPT、Stable Diffusion、ArchiVinci等）。\n多言語対応（日本語・中国語・英語）でグローバル展開にも対応。","x":0.07114583333333334,"y":0.46416666666666667,"w":0.39489583333333333,"h":0.1676851851851852,"footer":false},{"text":"※部門紹介：","x":0.55703125,"y":0.13657407407407407,"w":0.3333333333333333,"h":0.053703703703703705,"footer":false},{"text":"ロボット推進部：サービスロボット（配膳・案内等）の導入支援、設置・運用保守。\nAI DX推進部：AI・データ活用による業務DX化支援、システム開発・自動化ソリューション。\n製品推進部：自社・パートナー製品（EB、D365など）の企画、提案、導入、運用支援。","x":0.58265625,"y":0.20416666666666666,"w":0.32885416666666667,"h":0.21916666666666668,"footer":false}],"media":[{"src":"assets/semantic/p08-img01.png","x":0.6165104166666666,"y":0.46074074074074073,"w":0.2718229166666667,"h":0.43962962962962965,"kind":"image"}]},{"page":9,"source":12,"title":"5.1 ロボット推進部","template":"media-split","texts":[{"text":"5.1　ロボット推進部","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"サービスロボット（パートナー・メーカー）","x":0.05984375,"y":0.15537037037037038,"w":0.412184219160105,"h":0.05834208223972003,"footer":false},{"text":"テラボックス社は2023年より、サービスロボットの各社メーカーと契約させていただき、日本でのサービス展開をさせていただいております。\nこれまで、多くの展示会に出展させていただき、日本全国のサービス施設（旅館・ホテルや介護施設）を中心に展開しております。2027年度まで、400台以上の導入見込みとなります。","x":0.05984375,"y":0.2137124526100904,"w":0.47040100065616797,"h":0.1750987168270633,"footer":false},{"text":"物流ロボット（パートナー・メーカー）","x":0.059843667979002625,"y":0.5136237970253719,"w":0.35453125,"h":0.05834208223972003,"footer":false},{"text":"倉庫・物流センターを中心に新しい物流ソリューションを提供することにより、AGV/AGF/AMR関連の運搬ロボットを順次展開しております。","x":0.059843667979002625,"y":0.5820179352580928,"w":0.47040100065616797,"h":0.09024307378244387,"footer":false}],"media":[{"src":"assets/semantic/p09-img01.jpeg","x":0.5575016404199475,"y":0.0,"w":0.4424983595800525,"h":1.0000001458151064,"kind":"image"},{"src":"assets/semantic/p09-img02.png","x":0.07190666010498688,"y":0.4085978419364246,"w":0.08543594160104986,"h":0.0550469524642753,"kind":"image"},{"src":"assets/semantic/p09-img03.png","x":0.17608907480314961,"y":0.40859798775153106,"w":0.10660318241469817,"h":0.05626450860309128,"kind":"image"},{"src":"assets/semantic/p09-img04.png","x":0.3036727362204724,"y":0.41422251385243514,"w":0.08572137467191601,"h":0.04298279381743949,"kind":"image"},{"src":"assets/semantic/p09-img05.png","x":0.07190666010498688,"y":0.6823132108486439,"w":0.14429060039370079,"h":0.072641878098571,"kind":"image"},{"src":"assets/semantic/p09-img06.png","x":0.23710925196850394,"y":0.6823130650335375,"w":0.1953125,"h":0.07777777777777778,"kind":"image"}]},{"page":10,"source":13,"title":"5.1.1 サービスロボット","template":"gallery","texts":[{"text":"5.1.1　サービスロボット","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false}],"media":[{"src":"assets/semantic/p10-img01.png","x":0.03845538057742782,"y":0.5351077573636629,"w":0.09157791994750657,"h":0.3905514727325751,"kind":"image"},{"src":"assets/semantic/p10-img02.png","x":0.15452075131233595,"y":0.5480758238553514,"w":0.07282144028871392,"h":0.364615339749198,"kind":"image"},{"src":"assets/semantic/p10-img03.png","x":0.22062180118110236,"y":0.4738738699329251,"w":0.19680831692913386,"h":0.4664553805774278,"kind":"image"},{"src":"assets/semantic/p10-img04.png","x":0.3998266896325459,"y":0.6176068824730242,"w":0.17327944553805774,"h":0.30805234762321376,"kind":"image"},{"src":"assets/semantic/p10-img05.png","x":0.5392265419947506,"y":0.6037379702537183,"w":0.14171358267716536,"h":0.3515748031496063,"kind":"image"},{"src":"assets/semantic/p10-img06.png","x":0.7184273293963255,"y":0.6904746281714785,"w":0.14160621719160105,"h":0.22221653543307088,"kind":"image"},{"src":"assets/semantic/p10-img07.png","x":0.8600335465879265,"y":0.5866786235053951,"w":0.11297645997375329,"h":0.32601254009915426,"kind":"image"},{"src":"assets/semantic/p10-img08.png","x":0.0,"y":0.0,"w":1.0088298064304462,"h":1.0248429571303588,"kind":"image"},{"src":"assets/semantic/p10-img09.png","x":0.11493389107611549,"y":0.06211708953047536,"w":0.5697855150918635,"h":0.2539527559055118,"kind":"image"}]},{"page":11,"source":14,"title":"手が届く未来","template":"gallery","texts":[{"text":"手が届く未来","x":0.0,"y":0.027685185185185184,"w":1.0,"h":0.21787037037037038,"footer":false},{"text":"多様な形態のサービスロボットを提供するリーディングカンパニーとして、KEENONは包括的な製品ラインナップを展開。\nホテル、レストラン、複合商業施設、病院など、世界中のあらゆるシーンにロボットをシームレスに導入し、より快適な日常体験を実現します。","x":0.18697916666666667,"y":0.7938888888888889,"w":0.6281770833333333,"h":0.19277777777777777,"footer":false}],"media":[{"src":"assets/semantic/p11-img01.jpeg","x":-0.01375,"y":-0.014351851851851852,"w":1.0216145833333334,"h":1.0497222222222222,"kind":"image"},{"src":"assets/semantic/p11-img02.png","x":0.03125,"y":0.92,"w":0.07802083333333333,"h":0.0412037037037037,"kind":"image"}]},{"page":12,"source":15,"title":"5.1.1 サービスロボット","template":"media-split","texts":[{"text":"5.1.1　サービスロボット","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"・筐体とロボット基盤が自由に分離結合することが可能。\n・24時間働くUPロボット、ルーム配送の待ち時間でホテル掃除が可能。\n・AI電話自動応答システムを特別無料提供。","x":0.05555561023622047,"y":0.813315543890347,"w":0.7764388943569553,"h":0.0942448235637212,"footer":false}],"media":[{"src":"assets/semantic/p12-img01.png","x":0.050328576115485565,"y":0.13162992125984252,"w":0.6639284776902887,"h":0.6329307378244386,"kind":"image"},{"src":"assets/semantic/p12-img02.png","x":0.7325,"y":0.13162992125984252,"w":0.19311417322834645,"h":0.38070924467774864,"kind":"image"},{"src":"assets/semantic/p12-img03.png","x":0.7325,"y":0.5476210265383493,"w":0.19311417322834645,"h":0.3615944881889764,"kind":"image"}]},{"page":13,"source":16,"title":"5.1.1 サービスロボット","template":"gallery","texts":[{"text":"5.1.1　サービスロボット","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false}],"media":[{"src":"assets/semantic/p13-img01.png","x":0.05555561023622047,"y":0.13082443861184018,"w":0.870864501312336,"h":0.7820939049285506,"kind":"image"}]},{"page":14,"source":17,"title":"5.1.1 サービスロボット","template":"case-study","texts":[{"text":"【日本初】　介護施設におけるロボット導入","x":0.0540625,"y":0.15518518518518518,"w":0.39609375,"h":0.052592592592592594,"footer":false},{"text":"当社は、介護施設において日本で初めて配膳・掃除ロボットを導入したパイオニアです。\n高齢者施設という特有の環境において、入居者様の安全と快適性を最優先に考慮しながら、現場スタッフの業務負担を軽減し、サービス品質の向上を実現しました。\n介護施設を運営する企業の理念や現場の実情に深く寄り添いながら、ただ機器を導入するだけではなく、共に【ありたい姿】を描き、段階的に事業構築に取り組んできました。\n現場スタッフやご入居者様の視点を大切にし、導入前の要件整理から運用設計、現場教育、定着支援に至るまで一貫して伴走。\nその結果、ロボット導入が一時的な効率化にとどまらず、施設全体のサービス品質や働き方改革へとつながる支援を実現、定着率・満足度ともに高評価をいただいています。","x":0.0540625,"y":0.25305555555555553,"w":0.4753125,"h":0.5837962962962963,"footer":false},{"text":"5.1.1　サービスロボット","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false}],"media":[{"src":"assets/semantic/p14-img01.jpeg","x":0.601541092519685,"y":0.1242594050743657,"w":0.34301410761154855,"h":0.4054209682123068,"kind":"image"},{"src":"assets/semantic/p14-img02.jpeg","x":0.7835419127296588,"y":0.5439397783610382,"w":0.1610132874015748,"h":0.35401414406532516,"kind":"image"},{"src":"assets/semantic/p14-img03.jpeg","x":0.601541092519685,"y":0.5439396325459318,"w":0.1741947998687664,"h":0.35401414406532516,"kind":"image"}]},{"page":15,"source":18,"title":"5.1.2 物流ロボット","template":"media-split","texts":[{"text":"AGFロボット","x":0.03846153215223097,"y":0.12421289005540974,"w":0.17959719488188977,"h":0.052592592592592594,"footer":false},{"text":"5.1.2　物流ロボット","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666 ,"source":22,"title":"5.2 AI/DX推進部","template":"overview","texts":[{"text":"5.2　AI/DX推進部","x":0.052447916666666664,"y":0.027407407407407408,"w":0.5899479166666667,"h":0.08324074074074074,"footer":false},{"text":"AIアプリケーション開発","x":0.06098958333333333,"y":0.55389909594634,"w":0.24431332020997376,"h":0.04472222222222222,"footer":false},{"text":"LLMやコンピュータビジョン等を活用した先端AIアプリ開発事例","x":0.052447916666666664,"y":0.6146296296296296,"w":0.13260416666666666,"h":0.1660185185185185,"footer":false},{"text":"AI/DX推進部 詳細ページ","x":0.05671875,"y":0.5003703703703704,"w":0.23390625,"h":0.04324074074074074,"footer":false},{"text":"AI インテリジェント支援市場調査プロジェクト:\n市場データ収集と分析による戦略立案支援。","x":0.28,"y":0.534537037037037,"w":0.22583333333333333,"h":0.22796296296296295,"footer":false},{"text":"AI人材マッチングプロジェクト:\nAIを活用した人材採用・マッチング効率化事例。","x":0.5144270833333333,"y":0.5363888888888889,"w":0.20510416666666667,"h":0.272037037037037,"footer":false},{"text":"AIoT スマートメータープロジェクト:\n遠隔検針・自動化の実証実験と導入事例。","x":0.72875,"y":0.5315740740740741,"w":0.225625,"h":0.16092592592592592,"footer":false},{"text":"全業界向けAI・ローコード開発およびSIサービスを提供\n最新のAI技術とプラットフォームを活用し、業務効率化と新規ビジネス創出を支援","x":0.06510416666666667,"y":0.21537037037037038,"w":0.21723958333333335,"h":0.20592592592592593,"footer":false},{"text":"1.概要","x":0.07244791666666667,"y":0.16666666666666666,"w":0.3333333333333333,"h":0.049166666666666664,"footer":false},{"text":"2.実績","x":0.36140625,"y":0.1637037037037037,"w":0.08536458333333333,"h":0.049166666666666664,"footer":false},{"text":"AIアプリケーション開発（LLMやコンピュータビジョン等を活用）\nAIインテリジェント支援市場調査プロジェクト\nAI人材マッチングプロジェクト（採用効率向上）\nAIoTスマートメータープロジェクト（遠隔検針自動化）","x":0.34567708333333336,"y":0.21351851851851852,"w":0.23953125,"h":0.22870370370370371,"footer":false},{"text":"3.現在できること","x":0.65484375,"y":0.16194444444444445,"w":0.20536458333333332,"h":0.05296296296296296,"footer":false},{"text":"お客様の課題に合わせたAIソリューション設計・開発\nノーコード／ローコード開発による迅速なサービス提供\n業務プロセスの自動化とデータ活用によるDX推進","x":0.65484375,"y":0.2190740740740741,"w":0.22276041666666666,"h":0.17759259259259258,"footer":false}],"media":[{"src":"assets/semantic/p19-img01.png","x":0.56875,"y":0.6912962962962963,"w":0.11619791666666666,"h":0.20657407407407408,"kind":"image"},{"src":"assets/semantic/p19-img02.png","x":0.3257291666666667,"y":0.7133333333333334,"w":0.15,"h":0.18453703703703703,"kind":"image"},{"src":"assets/semantic/p19-img03.png","x":0.17921875,"y":0.6449074074074074,"w":0.10026041666666667,"h":0.2677777777777778,"kind":"image"},{"src":"assets/semantic/p19-img04.png","x":0.765,"y":0.6975925925925925,"w":0.1634375,"h":0.21509259259259259,"kind":"image"}]},{"page":20,"source":23,"title":"5.2 AI/DX推進部：AIアプリケーション開発","template":"flow","texts":[{"text":"1. 業界シニアコンサルタントの経験：\n- 自動車、貿易、HR、物流などの分野で 10 年以上の経験を持ち、現場の知識を活用します。\n2. 要件定義とプロセス分析：\n- 現場の課題を分析し、AI モデルの適用可能性を評価します。\n- 要件定義プロセスを 1 日で完了させることを目標としています。\n3. AI モデルの選定と定義：\n- 領域特化AIモデル（人材AI、市場AI、通関AI、バーチャルヒューマンAI）を事前に学習させ、適合するモデルを選定します。","x":0.05246727362204724,"y":0.1849058034412365,"w":0.4566473097112861,"h":0.3666665208515602,"footer":false},{"text":"4. AI モデル管理：\n- API を通じてAIモデルを差替し、GUI で 1 行実装することで、モデルの管理とバージョン管理を行います。\n5. ローコードプラットフォームの利用：\n- ローコードプラットフォームを使用して、画面フロー設計、承認ワークフローエンジン、データ連携エンジンを素早く構築します。\n6. 即時翻訳とプロセス：\n業務要件をローコードとAIタスクを活用して即座にプロセス化し、迅速なシナリオ構築と展開を実現します。","x":0.05246727362204724,"y":0.5753692038495188,"w":0.3503973097112861,"h":0.3666665208515602,"footer":false},{"text":"5.2　AI/DX推進部:AIアプリケーション開発","x":0.052447916666666664,"y":0.027407407407407408,"w":0.72890625,"h":0.08324074074074074,"footer":false},{"text":"高速実現フレームワーク","x":0.059583333333333335,"y":0.12212962962962963,"w":0.3542708333333333,"h":0.07731481481481481,"footer":false}],"media":[{"src":"assets/semantic/p20-img01.png","x":0.23036458333333334,"y":0.16814814814814816,"w":0.7621875,"h":0.7296296296296296,"kind":"image"},{"src":"assets/semantic/p20-img02.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"}]},{"page":21,"source":24,"title":"5.2 AI/DX推進部：AIアプリケーション開発","template":"architecture","texts":[{"text":"アプリケーションシナリオの拡張","x":0.052447916666666664,"y":0.1439814814814815,"w":0.48385416666666664,"h":0.07166666666666667,"footer":false},{"text":"事業戦略・競合分析\n競合他社の動向（新製品、特許、ニュース等）を常時監視し、自社の戦略立案やM&Aの機会発見に直結させます。\n製品開発・R&D\n世界の技術トレンドや論文、特許情報と、社内の研究データを結びつけ、新製品のアイデア創出と開発を加速します。\n営業・マーケティング\n顧客企業の最新情報と社内のCRMデータを統合し、個々の顧客に最適化された提案書や営業アプローチを自動で生成します。\n法務・コンプライアンス\n国内外の新しい法規制の動向を自動で追跡し、自社事業への潜在的リスクを早期に発見・警告します。","x":0.046927083333333335,"y":0.2212037037037037,"w":0.49494791666666665,"h":0.6209259259259259,"footer":false},{"text":"5.2　AI/DX推進部:AIアプリケーション開発","x":0.052447916666666664,"y":0.027407407407407408,"w":0.72890625,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p21-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p21-img02.png","x":0.56875,"y":0.18349577136191308,"w":0.38125,"h":0.6777777777777778,"kind":"image"}]},{"page":22,"source":25,"title":"5.2 AI/DX推進部：AIインテリジェント支援市場調査","template":"two-col","texts":[{"text":"市場調査に対する総合的なインテリジェントサポートを提供し、調査の効率と品質を向上させます。","x":0.028125,"y":0.2925715952172645,"w":0.3158307086614173,"h":0.09752537182852143,"footer":false},{"text":"AIインテリジェント支援研究","x":0.003513451443569554,"y":0.223444298629338,"w":0.3532104658792651,"h":0.055350831146106734,"footer":false},{"text":"インテリジェントな検索エンジンの自動分解、マルチモーダルリターン、自由な対話により、研究データの精度が向上します。","x":0.6271853674540683,"y":0.29599752114319045,"w":0.3051432086614173,"h":0.09752537182852143,"footer":false},{"text":"研究とインテリジェントなアップグレード","x":0.5942735400262468,"y":0.223444298629338,"w":0.3532104658792651,"h":0.055350831146106734,"footer":false},{"text":"ステージ共有サマリーを自動で実施し、中間レポートを生成し、全体の分析レポートをまとめて出力します。","x":0.030224819553805776,"y":0.6810129775444737,"w":0.3051432086614173,"h":0.09752537182852143,"footer":false},{"text":"自動化された調査プロセス","x":0.00190501968503937,"y":0.6084597550306212,"w":0.3532104658792651,"h":0.055350831146106734,"footer":false},{"text":"エンタープライズ ナレッジ ベースを確立し、チーム プロジェクトの進捗状況を共有し、パブリック ドメイン データをマイニングし、BI 自動化を実現します。","x":0.6272103838582677,"y":0.6639227179935842,"w":0.30515625,"h":0.11462962962962962,"footer":false},{"text":"ナレッジベースと進捗管理","x":0.5942735400262468,"y":0.6084597550306212,"w":0.3532104658792651,"h":0.055350831146106734,"footer":false},{"text":"プロジェクト紹介","x":0.03971612532808399,"y":0.13791236512102653,"w":0.9250565124671916,"h":0.07167818606007582,"footer":false},{"text":"5.2 AI/DX推進部：AI インテリジェント支援市場調査","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p22-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p22-img02.jpeg","x":0.33515132874015746,"y":0.20809565470982794,"w":0.30167363845144357,"h":0.5363086905803441,"kind":"image"}]},{"page":23,"source":26,"title":"5.2 AI/DX推進部：AIインテリジェント支援市場調査","template":"flow","texts":[{"text":"1. 自動分解と多次元検索\n- 研究テーマに基づいて、AI Agentが自動的に知的纬度を拆解し、多維度で並行してデータを検索します。\n2. Big Data検索精度向上\n- 検索結果を全体的に自動的に返し、AIモデルが自動的に整理し、精度を向上させます。\n3. 企業関連知識の自動関連付け\n- ユーザーがAIの返した結果に対して纬度を確定し、企業の関連知識を自動的に関連付け、統合します。\n4. 自動要約レポート\n- ユーザーのプロセスに基づいて、段階的な報告をカスタマイズし、報告の关键データをデータポイントとして設定し、自動的にBI出力を行ないます。\n5. 市場調査の効率と品質向上\n- 整体报告を全自动出力し、市場調査の効率と品質を向上させます。\n6. 企業知識庫の整理と自由会話\n- 企業の知識庫を整理し、自由な会話を通じて情報の共有と活用を促進します。","x":0.04447916666666667,"y":0.20351851851851852,"w":0.5569791666666667,"h":0.6783333333333333,"footer":false},{"text":"主な機能の説明","x":0.039739583333333335,"y":0.13185185185185186,"w":0.9052083333333333,"h":0.07166666666666667,"footer":false},{"text":"5.2 AI/DX推進部：AI インテリジェント支援市場調査","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p23-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p23-img02.png","x":0.6187420439632546,"y":0.14300495771361912,"w":0.3455757874015748,"h":0.7388888888888889,"kind":"image"}]},{"page":24,"source":27,"title":"5.2 AI/DX推進部：AIインテリジェント支援市場調査","template":"dashboard","texts":[{"text":"AIが研究を加速","x":0.12461286089238845,"y":0.6742429279673374,"w":0.3222533628608924,"h":0.06940390784485273,"footer":false},{"text":"3 週間のうち、ほとんどの作業は AI の支援により 1 時間以内に完了できます。","x":0.12445849737532809,"y":0.7637895888013998,"w":0.3222533628608924,"h":0.08963035870516185,"footer":false},{"text":"AIは効率を向上する","x":0.551066437007874,"y":0.6753011081948089,"w":0.3222533628608924,"h":0.06940390784485273,"footer":false},{"text":"AIテクノロジーは研究サイクルを大幅に短縮し、作業効率を向上させ、企業の競争上の優位性を高めます。","x":0.5509120734908136,"y":0.764847623213765,"w":0.3222533628608924,"h":0.08963035870516185,"footer":false},{"text":"時間的優位性","x":0.05880208333333333,"y":0.11407407407407408,"w":0.5172395833333333,"h":0.07166666666666667,"footer":false},{"text":"5.2 AI/DX推進部:AI インテリジェント支援市場調査","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p24-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p24-img02.png","x":0.08549737532808399,"y":0.19567206182560512,"w":0.40048433398950134,"h":0.44771872265966756,"kind":"image"},{"src":"assets/semantic/p24-img03.jpeg","x":0.5119508694225722,"y":0.19567206182560512,"w":0.40048433398950134,"h":0.44771872265966756,"kind":"image"}]},{"page":25,"source":28,"title":"5.2 AI/DX推進部：AI人材マッチング","template":"two-col","texts":[{"text":"AIが人材マッチングを支援","x":0.11338541666666667,"y":0.6730555555555555,"w":0.31083333333333335,"h":0.06583333333333333,"footer":false},{"text":"人材マッチングプロジェクトは、先進的なAI技術を活用し、人材と案件の正確かつ効率的なマッチングを実現し、企業の法務処理を強力にサポートします。","x":0.11322916666666667,"y":0.7670370370370371,"w":0.31083333333333335,"h":0.0849074074074074,"footer":false},{"text":"インテリジェントなマッチングで効率が向上","x":0.5526041666666667,"y":0.6741666666666667,"w":0.31083333333333335,"h":0.06583333333333333,"footer":false},{"text":"インテリジェントなマッチングを通じて、企業は適切な人材をより早く見つけ、案件処理の効率を高め、運用コストを削減し、企業の競争力を高めることができます。","x":0.5524479166666667,"y":0.7681481481481481,"w":0.31083333333333335,"h":0.0849074074074074,"footer":false},{"text":"プロジェクト紹介","x":0.058020833333333334,"y":0.11777777777777777,"w":0.8559375,"h":0.07166666666666667,"footer":false},{"text":"5.2 AI/DX推進部:AI人材マッチング","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p25-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p25-img02.jpeg","x":0.07307291666666667,"y":0.19675925925925927,"w":0.39255208333333336,"h":0.4387962962962963,"kind":"image"},{"src":"assets/semantic/p25-img03.png","x":0.51234375,"y":0.19675925925925927,"w":0.39255208333333336,"h":0.4387962962962963,"kind":"image"}]},{"page":26,"source":29,"title":"5.2 AI/DX推進部：AI人材マッチング","template":"flow","texts":[{"text":"Google メールボックスからメールとコンテンツを自動的に取得し、AI がケースと人材に関する基本情報をインテリジェントに判断、分類、要約してデータベースに保存します。","x":0.06288771325459318,"y":0.2825243511227763,"w":0.45518667979002625,"h":0.09752537182852143,"footer":false},{"text":"インテリジェントなクロールと分類","x":0.03554396325459318,"y":0.21886555847185768,"w":0.28764616141732285,"h":0.050456109652960046,"footer":false},{"text":"このシステムは、専門知識とケース要件に基づいて適切な人材をインテリジェントにマッチングして推奨し、自動的にスコアを付けて意思決定を支援します。","x":0.06288771325459318,"y":0.4902840478273549,"w":0.45518667979002625,"h":0.09752537182852143,"footer":false},{"text":"パーソナライズされたケースマッチング","x":0.03554396325459318,"y":0.4266252551764363,"w":0.2957060367454068,"h":0.050456109652960046,"footer":false},{"text":"情報を素早く見つけるためにケースや担当者による多次元クエリをサポートし、一致したケースをフォローアップしてフィードバックを提供し、担当者、顧客、プロジェクトのラベルを生成します。","x":0.06288771325459318,"y":0.710969524642753,"w":0.47018315288713913,"h":0.09752537182852143,"footer":false},{"text":"効率的なクエリとフィードバック","x":0.03554396325459318,"y":0.6473107319918343,"w":0.2112103838582677,"h":0.050456109652960046,"footer":false},{"text":"主な機能の説明","x":0.052424458661417324,"y":0.129856809565471,"w":0.9250565124671916,"h":0.07167818606007582,"footer":false},{"text":"5.2 AI/DX推進部:AI人材マッチング","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p26-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p26-img02.png","x":0.55625,"y":0.12806955380577428,"w":0.38125,"h":0.791297171186935,"kind":"image"}]},{"page":27,"source":30,"title":"5.2 AI/DX推進部：AI人材マッチング","template":"dashboard","texts":[{"text":"従来の方法では、1 人の担当者が 1 日に処理できる件数は最大で X 件であり、これは非効率的であり、企業の効率的な運営のニーズを満たすことができません。","x":0.05583333333333333,"y":0.2506481481481482,"w":0.30291666666666667,"h":0.22287037037037036,"footer":false},{"text":"AIマッチング技術の導入後、1人で1日80件の処理が可能になり、マッチングにかかる時間は1分のみとなり、処理速度と効率が大幅に向上しました。","x":0.06447916666666667,"y":0.4149074074074074,"w":0.2942708333333333,"h":0.22287037037037036,"footer":false},{"text":"AIマッチングが大幅に改善されました","x":0.06445759514435695,"y":0.5578840769903762,"w":0.2999236384514436,"h":0.047110382035578886,"footer":false},{"text":"従来の⽅法では限界","x":0.0316373031496063,"y":0.20629294254884806,"w":0.22940805446194226,"h":0.047110382035578886,"footer":false},{"text":"効率性の向上","x":0.03643487532808399,"y":0.12624569845435987,"w":0.9250565124671916,"h":0.07167818606007582,"footer":false},{"text":"5.2 AI/DX推進部:AI人材マッチング","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p27-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p27-img02.png","x":0.39375,"y":0.13060309128025663,"w":0.54375,"h":0.7388888888888889,"kind":"image"}]},{"page":28,"source":31,"title":"5.2 AI/DX推進部：AIoTスマートメーター","template":"flow","texts":[{"text":"通関業務プロジェクト紹介","x":0.04013279199475066,"y":0.13439384660250803,"w":0.9250565124671916,"h":0.07167818606007582,"footer":false},{"text":"AIで通関業界のDX（デジタルトランスフォーメーション）をリードする\n解決する課題：\n煩雑な手作業と高いエラー率\n非効率なコミュニケーションと時間的コスト\n進捗が不透明なブラックボックス状態\nコア機能：\nスマート識別： AIが申告書類を自動で読み取り・分類\nワンクリック申告： 複雑な手続きをボタン一つで実行\nプロセス可視化： 全ての通関状況をダッシュボードで一元管理\n顧客への提供価値：\nコスト削減： 人件費と運営コストを大幅にカット\n時間短縮： 申告から許可までの時間を劇的に短縮\nリスク管理： エラーを未然に防ぎ、コンプライアンスを強化","x":0.04266543635170603,"y":0.22268518518518518,"w":0.5377512303149606,"h":0.5769444444444445,"footer":false},{"text":"5.2 AI/DX推進部:AIoT スマートメーター","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p28-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p28-img02.jpeg","x":0.5714537401574803,"y":0.17103601633129192,"w":0.3937499179790026,"h":0.6999998541848935,"kind":"image"}]},{"page":29,"source":32,"title":"5.2 AI/DX推進部：AIoTスマートメーター","template":"dashboard","texts":[{"text":"プロジェクト紹介","x":0.039739583333333335,"y":0.12018518518518519,"w":0.80125,"h":0.07166666666666667,"footer":false},{"text":"主な課題:\n非効率な手動データ収集、データ精度の欠如、\nデジタルトランスフォーメーションの阻害。\n目的:\nデジタルアップグレード\nエネルギー消費データ収集の効率化\nエネルギー管理の最適化\n市場のスマート化に対応し、少人数・無人化運用を実現する。\n単位製品あたりのエネルギー消費量と炭素排出量の計算の精細化データ収集を達成し、データをクラウドで安全に保存し、認証された端末から閲覧可能にする。","x":0.04161458333333334,"y":0.2048148148148148,"w":0.42291666666666666,"h":0.616574074074074,"footer":false},{"text":"5.2 AI/DX推進部:AIoT スマートメーター","x":0.052447916666666664,"y":0.027407407407407408,"w":0.78859375,"h":0.08324074074074074,"footer":false}],"media":[{"src":"assets/semantic/p29-img01.png","x":0.19231332020997374,"y":0.9347701953922426,"w":0.022914370078740157,"h":0.04145392242636337,"kind":"image"},{"src":"assets/semantic/p29-img02.png","x":0.4998685203412073,"y":0.2333344998541849,"w":0.4749983595800525,"h":0.4749983960338291,"kind":"image"},{"src":"assets/semantic/p29-media03.mp4","kind":"video","x":0,"y":0,"w":1,"h":1},{"src":"assets/semantic/p29-media04.mp4","kind":"video","x":0,"y":0,"w":1,"h":1}]},{"page":30,"source":34,"title":"5.3 製品推進部（EB）","template":"two-col","texts":[{"text":"5.3 製品推進部(EB)","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"Engineering Base概要","x":0.05640625,"y":0.1476851851851852,"w":0.39557291666666666,"h":0.05814814814814815,"footer":false},{"text":"Engineering Base（EB）は、電気設計・自動化・設備設計などの分野に向けた統合型エンジニアリング設計プラットフォームです。\n統一データベースとマルチユーザー協働機能により、部門や分野をまたぐ設計データの共有とリアルタイム同期を実現します。","x":0.06796875,"y":0.24333333333333335,"w":0.30505208333333333,"h":0.4475925925925926,"footer":false}],"media":[{"src":"assets/semantic/p30-img01.png","x":0.4127604166666667,"y":0.21675925925925926,"w":0.5365104166666667,"h":0.5716666666666667,"kind":"image"}]},{"page":31,"source":35,"title":"5.3 製品推進部（EB）","template":"feature-grid","texts":[{"text":"5.3 製品推進部(EB)","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"Engineering Base 特点","x":0.06895833333333333,"y":0.14972222222222223,"w":0.38989583333333333,"h":0.05814814814814815,"footer":false},{"text":"単一データベース（Single Source of Truth）に基づく統合設計環境\n分野横断的なデータ一元管理（プロセス、電気、計装、オートメーション）\nモジュール化設計・ルールベース設計対応","x":0.07401041666666666,"y":0.21555555555555556,"w":0.4621354166666667,"h":0.2646296296296296,"footer":false},{"text":"Conventional Workflow","x":0.06744791666666666,"y":0.5601851851851852,"w":0.16296875,"h":0.15305555555555556,"footer":false},{"text":"CAD vs. EB","x":0.2959895833333333,"y":0.5601851851851852,"w":0.16296875,"h":0.15305555555555556,"footer":false},{"text":"Plant Model","x":0.5245833333333333,"y":0.5601851851851852,"w":0.16296875,"h":0.15305555555555556,"footer":false},{"text":"Diagrams & Lists","x":0.7531770833333333,"y":0.5601851851851852,"w":0.16296875,"h":0.15305555555555556,"footer":false},{"text":"IT Architecture","x":0.18348958333333334,"y":0.7364814814814815,"w":0.16296875,"h":0.15305555555555556,"footer":false},{"text":"Users & Access Permissions","x":0.6406770833333333,"y":0.7364814814814815,"w":0.16296875,"h":0.15305555555555556,"footer":false},{"text":"System Landscape","x":0.41208333333333336,"y":0.7364814814814815,"w":0.16296875,"h":0.15305555555555556,"footer":false},{"text":"デジタルツイン機能による運用・保守支援\n外部システム連携：PDM、PLM、ERP、DMS、3D CAD、シミュレーションツール\nライセンス形態：買い切り、期間レンタル、トークン方式（柔軟利用）","x":0.57,"y":0.21555555555555556,"w":0.3784895833333333,"h":0.2646296296296296,"footer":false}],"media":[]},{"page":32,"source":36,"title":"5.3 製品推進部（EB）","template":"architecture","texts":[{"text":"5.3 製品推進部(EB)","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"な適用分野と導入効果","x":0.5814583333333333,"y":0.14203703703703704,"w":0.38989583333333333,"h":0.05814814814814815,"footer":false},{"text":"プラントソリューション\n大規模プラントのエンジニアリング（プロセス制御、電気エンジニアリングを含む）特に、EPC（エンジニアリング、調達、建設）企業がターゲットとして明示されていること。\nプロセス産業\nプロセスエンジニアリングにおける機能エンジニアリング（基本設計、プロセス設計、詳細設計をカバー）\n電力配給\n電力伝送および配電のプロジェクト計画（電力エンジニアリングプラントの設計者および製図者を対象）\nモビリティソリューション\nモバイルシステムの設計（鉄道と自動車産業におけるモジュール式ハーネス設計を含む","x":0.5833854166666667,"y":0.21287037037037038,"w":0.37953125,"h":0.6402777777777777,"footer":false},{"text":"External\nCollaboration","x":0.4995826771653543,"y":0.7644956255468066,"w":0.23284793307086615,"h":0.09638174394867308,"footer":false},{"text":"Data Exchange & Migration","x":0.5297272801837271,"y":0.18737153689122193,"w":0.15453412073490813,"h":0.09638174394867308,"footer":false},{"text":"Digital Twin","x":0.2936378772965879,"y":0.2055936132983377,"w":0.1914757217847769,"h":0.05837007874015748,"footer":false},{"text":"Change Management","x":0.774487532808399,"y":0.34324613589967923,"w":0.13089279855643043,"h":0.09638174394867308,"footer":false},{"text":"Data Quality","x":0.09954265091863516,"y":0.36119743365412654,"w":0.13049917979002626,"h":0.05837007874015748,"foo oft Dynamics 365プラットフォームに基づいており、企業のデジタル変革を支援するソリューションを提供します。\nCRMとERP機能を深く融合させ、効率的なビジネス管理を実現します。","x":0.09104166666666667,"y":0.20462962962962963,"w":0.34963541666666664,"h":0.20175925925925925,"footer":false},{"text":"製品の特徴：","x":0.09104166666666667,"y":0.4761111111111111,"w":0.30484375,"h":0.053703703703703705,"footer":false},{"text":"カスタマイズ性：お客様の具体的なニーズに応じて、高度にカスタマイズされたD365ソリューションを提供します。\n高度な統合性：Office 365やAzureなど他のMicrosoftサービスとのシームレスな統合。\nデータ駆動型：AIとデータ分析を活用し、企業のインテリジェントな運営を推進します。","x":0.09104166666666667,"y":0.5375925925925926,"w":0.34963541666666664,"h":0.2646296296296296,"footer":false}],"media":[{"src":"assets/semantic/p33-img01.png","x":0.5136458333333334,"y":0.22722222222222221,"w":0.4365104166666667,"h":0.5173148148148148,"kind":"image"}]},{"page":34,"source":38,"title":"5.3 製品企画部（D365）","template":"feature-grid","texts":[{"text":"5.3 製品企画部（D365）","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"会社製品の利用シーン","x":0.06604166666666667,"y":0.14935185185185185,"w":0.30484375,"h":0.053703703703703705,"footer":false},{"text":"財務データのリアルタイム監視を実現し、サプライチェーン効率を向上させ、運営コストを削減します。","x":0.3723958333333333,"y":0.31203703703703706,"w":0.24270833333333333,"h":0.1075,"footer":false},{"text":"販売と顧客管理：","x":0.0728125,"y":0.24481481481481482,"w":0.3040625,"h":0.049166666666666664,"footer":false},{"text":"精密な販売予測と顧客関係管理を支援し、販売実績を向上させます。","x":0.09526041666666667,"y":0.31203703703703706,"w":0.24427083333333333,"h":0.07611111111111112,"footer":false},{"text":"財務と運営の最適化：","x":0.34838541666666667,"y":0.24481481481481482,"w":0.3040625,"h":0.049166666666666664,"footer":false},{"text":"Power Automateを活用して業務プロセスを自動化し、作業効率を向上させます。\nPower BIとの統合により、リアルタイムのデータ分析とインテリジェントな意思決定支援を行います。","x":0.6795833333333333,"y":0.31203703703703706,"w":0.2869791666666667,"h":0.20175925925925925,"footer":false},{"text":"自動化とインテリジェント分析：","x":0.6565104166666667,"y":0.24481481481481482,"w":0.23677083333333335,"h":0.049166666666666664,"footer":false}],"media":[{"src":"assets/semantic/p34-img01.png","x":0.09526041666666667,"y":0.4951851851851852,"w":0.17880208333333333,"h":0.31787037037037036,"kind":"image"},{"src":"assets/semantic/p34-img02.png","x":0.40630208333333334,"y":0.49314814814814817,"w":0.17890625,"h":0.31805555555555554,"kind":"image"},{"src":"assets/semantic/p34-img03.png","x":0.7003125,"y":0.510462962962963,"w":0.24552083333333333,"h":0.2910185185185185,"kind":"image"}]},{"page":35,"source":40,"title":"6.IT人材サービス事業部","template":"overview","texts":[{"text":"6. IT人材サービス事業部","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"概要","x":0.05984375,"y":0.14416666666666667,"w":0.31979166666666664,"h":0.05814814814814815,"footer":false},{"text":"1. チーム\n幅広い業界・業種に対応できるITエンジニアを提供する人材サービス部門\nクライアントのプロジェクト要件に最適なスキルを持つ人材を迅速にマッチング","x":0.08401041666666667,"y":0.2364814814814815,"w":0.244375,"h":0.2940740740740741,"footer":false},{"text":"2.業界経験：\nシステム開発、インフラ構築、運用保守、AI・DX関連プロジェクトなど多分野での人材提供実績\n大手企業から中小企業まで、短期・長期案件やSES常駐型案件に対応\nエンジニア育成やスキルアップ支援を通じて、安定した高品質の人材供給を実現","x":0.38005208333333335,"y":0.23287037037037037,"w":0.24583333333333332,"h":0.33490740740740743,"footer":false},{"text":"3.できること：\nクライアントの要件分析から人材提案、アサイン、稼働フォローまで一貫サポート\n最新技術（クラウド、AI、RPAなど）に精通した人材の提供\n国内外の多様なバックグラウンドを持つエンジニアによるグローバル対応","x":0.6848958333333334,"y":0.23879629629629628,"w":0.23942708333333335,"h":0.2612962962962963,"footer":false},{"text":"※ 詳細コース：(内容準備中)","x":0.0746875,"y":0.5826851851851852,"w":0.3333333333333333,"h":0.053703703703703705,"footer":false},{"text":"人材紹介：企業のニーズに合わせ、最適なスキルと経験を持つIT人材を     迅速に提案・紹介。","x":0.09776041666666667,"y":0.6448148148148148,"w":0.38473958333333336,"h":0.07166666666666667,"footer":false},{"text":"IT人材研修：最新技術や業務知識の研修プログラムを提供し、即戦力となる人材を育成。","x":0.09776041666666667,"y":0.7372222222222222,"w":0.38,"h":0.07166666666666667,"footer":false},{"text":"人材プラットフォーム運営：IT人材と企業を結ぶオンラインプラットフォームを運営し、効率的なマッチングを実現。","x":0.09692708333333333,"y":0.8351851851851851,"w":0.40307291666666667,"h":0.07166666666666667,"footer":false}],"media":[{"src":"assets/semantic/p35-img01.png","x":0.6366145833333333,"y":0.5836111111111111,"w":0.28770833333333334,"h":0.3410185185185185,"kind":"image"}]},{"page":36,"source":41,"title":"6.IT人材サービス事業部","template":"flow","texts":[{"text":"6. IT人材サービス事業部","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"人材紹介","x":0.08911458333333333,"y":0.15212962962962964,"w":0.3333333333333333,"h":0.053703703703703705,"footer":false}],"media":[{"src":"assets/semantic/p36-img01.png","x":0.19119791666666666,"y":0.2772222222222222,"w":0.23848958333333334,"h":0.402037037037037,"kind":"image"},{"src":"assets/semantic/p36-img02.png","x":0.6097395833333333,"y":0.290462962962963,"w":0.20203125,"h":0.3887962962962963,"kind":"image"}]},{"page":37,"source":42,"title":"6.IT人材サービス事業部","template":"three-col","texts":[{"text":"6. IT人材サービス事業部","x":0.05984375,"y":0.026944444444444444,"w":0.6122916666666667,"h":0.08305555555555555,"footer":false},{"text":"IT人材研修","x":0.07520833333333334,"y":0.1524074074074074,"w":0.3333333333333333,"h":0.053703703703703705,"footer":false}],"media":[{"src":"assets/semantic/p37-img01.png","x":0.08385416666666666,"y":0.3181481481481481,"w":0.16921875,"h":0.3590740740740741,"kind":"image"},{"src":"assets/semantic/p37-img02.png","x":0.31588541666666664,"y":0.3181481481481481,"w":0.13786458333333335,"h":0.3611111111111111,"kind":"image"},{"src":"assets/semantic/p37-img03.png","x":0.5219270833333334,"y":0.31962962962962965,"w":0.17270833333333332,"h":0.34935185185185186,"kind":"image"},{"src":"assets/semantic/p37-img04.png","x":0.7452604166666666,"y":0.32851851851851854,"w":0.1625,"h":0.3486111111111111,"kind":"image"}]},{"page":38,"source":43,"title":"7.主要取引先（一部）","template":"logo-wall","texts":[{"text":"7.主要取引先 (一部)","x":0.03971456692913386,"y":0.04603674540682415,"w":0.9249803149606299,"h":0.07149606299212598,"footer":false},{"text":"敬称略順不同","x":0.7 function standard(p,body){const texts=p.texts.filter(x=>!x.footer),foot=p.texts.filter(x=>x.footer),media=p.media;let z;
 if(['three-col','vision'].includes(p.template)){z=zones(body,3);texts.forEach((t,i)=>z[Math.min(2,Math.floor(t.x*3))].append(contentBlock(t,i)));media.forEach(m=>z[Math.min(2,Math.floor(m.x*3))].append(mediaBlock(m)))}
 else if(['overview','two-col','media-split','case-study','cover'].includes(p.template)){z=zones(body,2);texts.forEach((t,i)=>z[t.x<.5?0:1].append(contentBlock(t,i)));media.forEach(m=>z[m.x<.5?0:1].append(mediaBlock(m)))}
 else if(['gallery','logo-wall'].includes(p.template)){media.forEach(m=>body.append(mediaBlock(m)));texts.forEach((t,i)=>body.append(contentBlock(t,i)))}
 else if(['dashboard','flow','architecture','feature-grid'].includes(p.template)){texts.forEach((t,i)=>body.append(contentBlock(t,i)));media.forEach(m=>body.append(mediaBlock(m)))}
 else {z=zones(body,2);texts.forEach((t,i)=>z[t.x<.5?0:1].append(contentBlock(t,i)));media.forEach(m=>z[m.x<.5?0:1].append(mediaBlock(m)))}
 if(foot.length){const f=mk('footer','footer-zone');foot.forEach((t,i)=>f.append(contentBlock(t,texts.length+i)));body.append(f)}
}
function vision(p,body){const imgs=p.media.map(mediaBlock),c1=mk('section','col'),c2=mk('section','col'),c3=mk('section','col');c1.innerHTML='<h3>拝啓</h3><p>テラボックスは、様々なビジネスシーンで経験を積んだ優秀且つ精鋭なメンバーが結集し設立されました。従来より更に多業種の企業様から信頼されるビジネスパートナーとして真摯にビジネス推進を行って参ります。\n\n弊社はプロパーと他のIT企業様とのグローバルネットワークを構築し、緊密な連携により企業様の経営戦略、AI・DXからIT構築・保守・メンテナンスまで一気通貫で対応可能な体制を整えております。</p>';c2.innerHTML='<p>弊社の三つの主軸事業ビジネスは下記の通りです：\n\n・エンジニアリング事業\n・ソリューション事業\n・IT人材サービス事業\n\n業種では、金融業界のビジネス経験者が多数在籍しております。\n\nよって、高いセキュリティ意識を持ってビジネス推進しております。\n\n今後更に、ビジネス領域・体制を強化拡大し、社会に貢献できる企業を目指します。</p>';if(imgs[0])c3.append(imgs[0]);const s=mk('p','signature','敬具\n\nテラボックス株式会社\n代表取締役　荊威\nJing Wei');c3.append(s);const f=mk('footer','page-footer');if(imgs[1])f.append(imgs[1]);f.append(document.createTextNode('テラボックス株式会社　© Terabox Inc. 2025 All Rights Reserved.'));body.append(c1,c2,c3,f)}
PAGES.forEach((p,i)=>{const s=mk('section','slide '+p.template);s.dataset.title=p.title;s.dataset.sourceText=p.texts.length;s.dataset.sourceMedia=p.media.length;const h=mk('header','head');h.innerHTML=`<b>${String(i+1).padStart(2,'0')} / 38</b><h2>${p.title}</h2>`;const b=mk('div','body');s.append(h,b);standard(p,b);[...s.querySelectorAll('.block,.media')].forEach(x=>{if(!x.textContent.trim()&&!x.querySelector('img,video'))x.remove()});const count=s.querySelectorAll('.block,.media').length;if(count>12)s.classList.add('dense');if(count>20)s.classList.add('ultra-dense');deck.append(s);const n=mk('button','');n.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><span>${p.title}</span>`;nav.append(n)});
const slides=[...document.querySelectorAll('.slide')],buttons=[...nav.children],topTitle=document.getElementById('topTitle'),readout=document.getElementById('readout');let current=0;function fit(s){const b=s.querySelector('.body');b.style.zoom='1';const ratio=Math.min(1,b.clientHeight/b.scrollHeight,b.clientWidth/b.scrollWidth);if(ratio<.995)b.style.zoom=String(Math.max(.58,ratio*.985))}function show(i){current=(i+38)%38;slides.forEach((s,j)=>s.classList.toggle('active',j===current));buttons.forEach((b,j)=>b.classList.toggle('active',j===current));topTitle.textContent=slides[current].dataset.title;readout.textContent=`${String(current+1).padStart(2,'0')} / 38`;buttons[current].scrollIntoView({block:'nearest'});fit(slides[current]);history.replaceState(null,'',`#slide-${current+1}`)}buttons.forEach((b,i)=>b.onclick=()=>show(i));document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);window.onkeydown=e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(current+1);if(['ArrowLeft','PageUp'].includes(e.key))show(current-1)};window.onresize=()=>fit(slides[current]);const m=location.hash.match(/slide-(\d+)/);show(m?+m[1]-1:0);
</script></body></html>
